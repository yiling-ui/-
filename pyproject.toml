[project]
name = "altcoin-momentum-agent"
version = "1.0.0"
description = "Multimodal AI trading agent for early altcoin pump/dump detection"
requires-python = ">=3.10"
authors = [{ name = "yiling-ui" }]
dependencies = [
    "ccxt>=4.4.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
socks = ["aiohttp_socks>=0.8"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
altcoin-agent = "altcoin_agent.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "ASYNC230", "ASYNC240"]
