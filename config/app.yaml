# Altcoin Agent V1.0 minimal config
# Override via the same keys in your own config file (mounted into the
# container at /app/config/app.yaml).

# Exchange selection.
# ``main.py._build_live_adapter`` uses the first entry of this list as
# the live trading venue. The two primary venues (binance, gate) are
# explicitly tested for ccxt quirks. Reserved venues (okx, bybit,
# bitget, kucoin, mexc, bingx) work but log a one-line note at boot.
# Operators who want fail-over to a second venue should treat the
# extra entries as documentation only — V1.0 trades on a single venue
# at a time.
exchanges:
  - binance
  # - gateio        # <- swap to: trade on Gate.io USDT futures
  # - okx           # <- reserved-but-tested
  # - bybit         # <- reserved-but-tested
  # - bitget        # <- reserved-but-tested

# ccxt unified-symbol form for USDT-margined perpetual swaps.
symbols:
  - BTC/USDT:USDT

timeframes:
  - 1m
  - 5m

healthz_port: 8080
graceful_timeout_sec: 30
initial_equity_usdt: 10000

# Dry-run is the default. ALWAYS run a fresh deploy with dry_run: true for
# at least 24 hours before flipping to false.
#
# Live-mode acknowledgement (Bug C5 fix): when dry_run is false AND
# paper_trade is false, main.py now requires the LIVE_CONFIRM environment
# variable to be set to the literal string "I_UNDERSTAND" — otherwise it
# refuses to start with exit code 3. This guards against accidental
# DRY_RUN=0 from a stale shell or CI script. paper_trade against a venue
# testnet is exempt because no real funds are at stake.
dry_run: true

# ----- LLM + self-evolution knobs (optional) -----
# Per-symbol cooldown between DeepSeek consults. Higher = fewer tokens spent.
# Set to 0 only when running a backtest sweep.
llm_consult_cooldown_sec: 300

# Max events queued for LLM consultation before the screener_sink starts
# dropping new arrivals. The drop is intentional: rule scoring continues
# unaffected, only the LLM verdict is missing.
llm_queue_max: 256

# Delay between an order opening and its post-mortem learning sweep. 1h is
# long enough for typical 15-60min altcoin moves to fully play out.
post_mortem_delay_sec: 3600

# Path to the learned-rules JSON. When unset, follows the DYNAMIC_RULES_JSON
# env var, then falls back to <repo>/.kiro/steering/dynamic_rules.json.
# dynamic_rules_path: /app/.kiro/steering/dynamic_rules.json


# ----- Operational patches (large-account / withdrawals / TG control) -----

# Depth-aware notional cap (闸门 #10b in gate.py). When set, a single
# order's notional cannot exceed N% of the live top-5 orderbook depth.
# Highly recommended at 0.10 once the account passes ~5,000 USDT —
# below that the leverage cap dominates anyway. Default 0.0 = off.
max_notional_vs_depth_pct: 0.10

# WithdrawalDetector — reconciles AccountState.equity_usdt to venue
# truth on a poll cycle. Off by default in V1.0; flip on after
# verifying the adapter's fetch_total_usdt_balance matches your
# venue's "wallet balance + unrealised pnl". The startup grace
# avoids a false "deposit" event during reconciliation.
withdrawal_detector_enabled: false
withdrawal_poll_sec: 300.0
withdrawal_min_significant_delta_usdt: 100.0
withdrawal_startup_grace_sec: 30.0

# Equity snapshot cadence (dashboard PnL chart).
equity_snapshot_interval_sec: 60.0

# Telegram two-way command poller. Off by default. Read commands
# (/status /equity /positions /pnl /help) work when the chat is
# whitelisted. Write commands (/halt /resume) additionally require
# telegram_commands_allow_write=true.
#   TG_BOT_TOKEN env var: the same bot token used by the notifier.
#   allowed_chat_ids: list of integer chat IDs that may issue
#                     commands. Anything else is silently dropped.
telegram_commands_enabled: false
telegram_commands_allow_write: false
telegram_commands_allowed_chat_ids: []

# ----- Reversal guard (post-review) -----
# Operator instruction: 反手要谨慎防止插针，合理规划风险要么就平仓观望，
# 等待时机。只有合适时机才反手。
# When a high-priority signal would flip our existing position (or
# would re-enter opposite within reversal_guard_recent_close_window_sec
# of a close), the ReversalGuard either VETOES (wick / score / cooldown
# fail) or DEFERS the trade (close-and-watch). The "approve" path is
# narrow by design: only post-close reversals that pass every check
# are allowed straight through.
# Defaults are fail-closed; tighten or relax in production.
reversal_guard_enabled: false
# Window after a close in which an opposite-direction signal counts
# as a reversal candidate (still subject to all other checks).
reversal_guard_recent_close_window_sec: 300
# Wick / 插针 detector — Parkinson range over this window must be
# below ``wick_threshold_pct`` of mid for a reversal to be allowed.
reversal_guard_wick_window_sec: 60
reversal_guard_wick_threshold_pct: 0.04
# The flipped signal's final_score must clear this floor.
reversal_guard_min_reversal_final_score: 7.5
# After a veto, set this cooldown on the symbol so we don't thrash.
reversal_guard_cooldown_sec: 120
# Minimum elapsed time since the close for a post-close reversal.
# Below this we always defer "close and watch".
reversal_guard_min_seconds_since_close: 30
