services:
  altcoin-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Optional mirror overrides for restricted networks. Set via env or .env:
        #   APT_MIRROR=mirrors.tuna.tsinghua.edu.cn
        #   PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
        #   PIP_TRUSTED_HOST=pypi.tuna.tsinghua.edu.cn
        APT_MIRROR: "${APT_MIRROR:-}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-}"
        PIP_TRUSTED_HOST: "${PIP_TRUSTED_HOST:-}"
    image: altcoin-agent:v1.0
    container_name: altcoin-agent
    restart: always
    env_file:
      - .env
    environment:
      DRY_RUN: "${DRY_RUN:-true}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      - "${HEALTHZ_PORT:-8080}:8080"
    volumes:
      # Persist learned rules across restarts (the fuser hot-loads from here).
      - ./.kiro:/app/.kiro
      # Override the YAML config without rebuilding the image.
      - ./config:/app/config:ro
      # Logs out to host for tailing.
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
